name: Sync Stock from Wholesaler

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        cd scraper
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Run Scraper
      env:
        FELIUBADALO_EMAIL: ${{ secrets.FELIUBADALO_EMAIL }}
        FELIUBADALO_PASSWORD: ${{ secrets.FELIUBADALO_PASSWORD }}
      run: |
        cd scraper
        python scraper.py

    - name: Send data to Webhook
      env:
        SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        cd scraper
        FILE_SIZE=$(stat --printf="%s" productos_veganos.json 2>/dev/null || stat -f%z productos_veganos.json 2>/dev/null || echo "unknown")
        echo "Enviando datos al webhook... (File size: ${FILE_SIZE} bytes)"
        curl -X POST \
             -H "Content-Type: application/json" \
             -H "Authorization: Bearer $SYNC_SECRET" \
             --data-binary @productos_veganos.json \
             --fail \
             --show-error \
             --max-time 120 \
             --retry 2 \
             --retry-delay 10 \
             -w "\nHTTP Status: %{http_code}\n" \
             "$WEBHOOK_URL"
